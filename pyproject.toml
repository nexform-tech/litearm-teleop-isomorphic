[project]
name = "liteteleop"
version = "0.0.0"
description = "Isomorphic leader-follower teleoperation console for the LiteArm robotic arm series"
requires-python = ">=3.10"
# ⚠ PyPI 上的发行名是 `eclipse-zenoh`（import 名仍是 `zenoh`）。写 `zenoh` 装不上：
#   `ERROR: No matching distribution found for zenoh` —— CI 就这么挂在装依赖上过。
dependencies = ["eclipse-zenoh>=1.6", "PyQt5>=5.15"]

[project.scripts]
liteteleop = "liteteleop.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: 慢测（起子进程 / 数十秒），用 -m \"not slow\" 跳过"]
