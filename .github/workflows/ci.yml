# Test gate for a repository that currently ships documentation only.
#
# Tests live in their own workflow: they run on pull requests, while the release
# workflow runs on pushes to the default branch. Mixing the two means a broken
# release blocks a pull request, or the reverse.
#
# Source code has landed, so the real toolchain gate is now below ("Run test suite").
# ⚠ Without it, stage-1's headline acceptance criterion ("pytest 全绿") is enforced
# nowhere but on a developer's laptop.
#
# AGENTS.md is deliberately not linted: it is canonical content synced from
# repo-template and must not be edited here.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true # a superseded pull request run is pointless

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The SDK is not on PyPI; it lives in the public nexform-tech/litearm-python
      # repository and is pinned by path (see liteteleop/__main__.py). Check it out
      # so the suite resolves the same `litearm` it does on a developer's machine.
      # ⚠ Into `.litearm-sdk/`, not the repository root — a root checkout would drop
      #   that project's tests/ next to ours. `pytest tests` is scoped, but keeping
      #   the two trees apart means neither can be collected by accident.
      - name: Checkout litearm SDK
        uses: actions/checkout@v4
        with:
          repository: nexform-tech/litearm-python
          path: .litearm-sdk

      # ⚠ The PyPI distribution is `eclipse-zenoh`; the *import* name is `zenoh`.
      #   Installing "zenoh" fails with "from versions: none" before any test runs
      #   — which is exactly what this workflow did until 2026-09-29.
      - name: Install dependencies
        run: python3 -m pip install --upgrade pip && python3 -m pip install pytest "eclipse-zenoh>=1.6"

      - name: Run test suite
        env:
          LITEARM_SRC: ${{ github.workspace }}/.litearm-sdk/src
        run: python3 -m pytest tests -q

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "README.md"

      - name: Validate repository standards
        run: |
          set -euo pipefail
          test -s README.md
          test -s AGENTS.md
          test -s LICENSE
          python3 -c "import json; json.load(open('.releaserc.json'))"
          python3 -c "import json; json.load(open('.markdownlint.json'))"
          echo "repository standards OK"
